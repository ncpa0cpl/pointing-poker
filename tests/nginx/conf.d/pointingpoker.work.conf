# Mirror of the production pointingpoker.work server block. Deviations from
# prod:
#   - TLS certs are the repo's test certificates (prod uses Let's Encrypt);
#     the certbot-managed directives are omitted — options-ssl-nginx.conf and
#     the ssl_dhparam file don't exist in the container
#   - the certbot `if`-block on port 80 is replaced by an equivalent plain
#     redirect
#   - proxy_pass targets the app service by container-network name instead
#     of http://localhost:6969 (systemd ran the app on the same host in prod)

server {
	server_name pointingpoker.work;
	http2 off;

	location ~* \.php$ {
	        return 403;
    }

     # Block common scanner paths (WordPress, admin panels, env files, etc.)
    location ~* ^/(wp-content|wp-admin|wp-includes|wp-login\.php|admin|phpmyadmin|\.env|\.git|xmlrpc\.php) {
        return 403;
    }

    # Block common script/config extensions
    location ~* \.(asp|aspx|cgi|sh|py|rb|pl|cfm|htaccess|htpasswd)$ {
        return 403;
    }

	location /ws/ {
	    proxy_pass http://app:6969;
	    proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection "upgrade";
	    proxy_set_header Host $http_host;
	    proxy_set_header X-Forwarded-By nginx;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_read_timeout 1800;
	    proxy_send_timeout 1800;
	}

	location / {
		proxy_send_timeout 1800;
		proxy_read_timeout 1800;

		proxy_set_header X-Forwarded-By nginx;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://app:6969;
    }

    location ~ /.well-known {
        allow all;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

}

# remove www. from the hostname
server {
	listen 80;
	http2 off;
	server_name www.pointingpoker.work;
	return 301 https://pointingpoker.work$request_uri;
}


server {
	listen 80;
	http2 off;
    server_name pointingpoker.work;

    return 301 https://$host$request_uri;
}
